
name: Gerar APK TCL Nova Remote

on:
  workflow_dispatch:
  push:
    paths:
      - 'TCL-Nova-Remote-v01-source.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Instalar Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Extrair projeto
        run: unzip -q TCL-Nova-Remote-v01-source.zip
      - name: Gerar APK
        run: gradle -p TCL-Nova-Remote :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: TCL-Nova-Remote-APK
          path: TCL-Nova-Remote/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
